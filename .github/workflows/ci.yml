name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-js:
    name: Test (js backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Run tests
        run: |
          moon version --all
          moon update
          moon test --target js

  test-native:
    name: Test (native backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install OpenSSL headers (async TLS stubs)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Run tests
        run: |
          moon version --all
          moon update
          moon test --target native

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Check formatting
        run: |
          moon update
          moon fmt
          git diff --exit-code
